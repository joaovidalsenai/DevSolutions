            <button type="submit" class="btn-busca-hospital">

            </button>
        </form>
        <div class="div-butoes">
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/Perfil2.png" alt="">
                </span>
                <span class="botao-hospital-nome">Perfil</span>
            </button>
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/Cima.png" alt="">
                </span>
                <span class="botao-hospital-nome">Hospitais mais procurados</span>
            </button>
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/Fone.png" alt="">
                </span>
                <span class="botao-hospital-nome">Suporte técnico</span>
            </button>
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/Block.png" alt="">
                </span>
                <span class="botao-hospital-nome">Hospitais com menor lotação</span>
            </button>
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/Loc.png" alt="">
                </span>
                <span class="botao-hospital-nome">Hospitais mais próximos</span>
            </button>
            <button type="button" class="botao-hospital">
                <span class="botao-hospital-nota">
                    <img src="assets/I.png" alt="">
                </span>
                <span class="botao-hospital-nome">Sobre nós</span>
            </button>
